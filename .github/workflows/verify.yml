name: verify

# Every generated file in this repository is committed, so `verify.py` regenerates them and
# demands that generation preserve the candidate state. The conformance corpus stopped building and
# a README's counts went wrong in five places before anything ran that check.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The history-cleanup and registry-contract probes read files at earlier commits.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the four distributions
        run: |
          for package in escapewheel-reader escapewheel-validator escapewheel-writer escapewheel-aind; do
            uv sync --all-extras --project "$package"
          done
      - name: Every generator and every check
        run: uv run --project escapewheel-writer python verify.py
