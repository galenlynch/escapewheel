name: verify

# Every generated file in this repository is committed, so `verify.py` regenerates them and
# demands that generation preserve the candidate state. Three artifacts drifted for many revisions
# before anything ran that check: the conformance corpus stopped building, the prototype's registry
# left R2's format, and the registry README's counts went wrong in five places.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the four distributions
        run: |
          for package in escapewheel-reader escapewheel-validator escapewheel-writer escapewheel-aind; do
            uv sync --all-extras --project "$package"
          done
      - name: Every generator and every check
        run: uv run --project escapewheel-writer python verify.py
