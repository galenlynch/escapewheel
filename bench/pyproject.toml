[project]
name = "escapewheel-bench"
version = "0"
description = "Benchmarks of Escapewheel packets against other formats and stores"
requires-python = ">=3.12"
dependencies = [
    "escapewheel-reader[sql,polars]",
    "duckdb>=1.5.5",
    "hdmf-zarr>=0.13",
    "lazynwb>=0.2.91",
    "numpy>=1.26",
    "obstore>=0.11",
    "pandas>=2",
    "polars>=1.44",
    "pyarrow>=25.0.1",
    "pynwb>=4.2",
    "s3fs>=2026.7.0",
    "boto3>=1.40",
    "narwhals>=2.26.0",
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false

[tool.uv.sources]
escapewheel-reader = { path = "../escapewheel-reader", editable = true }
