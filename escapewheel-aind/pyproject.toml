[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "escapewheel-aind"
description = "AIND source adapters for escapewheel packets"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Allen Institute for Neural Dynamics" },
  { name = "Galen Lynch", email = "galen@galenlynch.com" },
]
classifiers = ["Programming Language :: Python :: 3"]
readme = "README.md"
version = "0.1.0"

# The writer, because an adapter is constructed by a build and hands back records it defines.
# One direction only: nothing in the writer may import this package, which is what keeps the
# dependency a boundary rather than a cycle.
#
# numpy and pyarrow are the video adapter's: it builds frame tables rather than record dicts.
dependencies = [
    "escapewheel-writer",
    "numpy>=1.26",
    "pyarrow>=25.0.1",
]

# Source kinds this distribution registers, by the name a recipe names them. The group is
# `escapewheel_writer.adapter.SOURCE_GROUP`, and `adapter.discovered()` loads it; a registered kind
# is constructed exactly as a built-in one is (`session.build`), so nothing here is a lesser source.
# The recipe drafter's lookups: DocDB, Code Ocean, and S3. Optional, because a build reading these
# adapters' sources needs none of them.
[project.optional-dependencies]
recipe = [
    "aind-data-access-api>=1.10",
    "codeocean>=0.17",
    # A drafted recipe stages the sorting's waveforms as Zarr, which the writer writes only with this extra.
    "escapewheel-writer[arrays]",
    "s3fs>=2026.7",
]

[project.scripts]
escapewheel-aind-recipe = "escapewheel_aind.recipe.cli:main"

[project.entry-points."escapewheel.sources"]
session = "escapewheel_aind.session:SessionSource"
video = "escapewheel_aind.video:VideoSource"
aind_nwb = "escapewheel_aind.nwb:AindNWBSource"
aind_unit_qc = "escapewheel_aind.unit_qc:UnitQCSource"

# What these adapters work around in their sources, which reaches a packet's
# `core.processing_runs.parameters` through `compensations.registered()`. Declared here because the
# faults belong to this institution's sources, and the writer stands behind only its own.
[project.entry-points."escapewheel.compensations"]
aind = "escapewheel_aind.compensations:COMPENSATIONS"

[project.urls]
Repository = "https://github.com/galenlynch/escapewheel/"
Issues = "https://github.com/galenlynch/escapewheel/issues"

[dependency-groups]
types = [
    "mypy",
    "pyarrow-stubs>=20.0.0.20260819",
]
dev = [
    { include-group = "types" },
    "codespell",
    # The NWB fixture writes Zarr v2 chunks itself, as the writer's does, so it needs the codecs.
    "numcodecs",
    "pytest",
    "pytest-cov",
    "ruff",
    "interrogate",
]

[tool.hatch.build.targets.wheel]
packages = ["src/escapewheel_aind"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Markdown is prose; its code blocks illustrate rather than run.
extend-exclude = ["scratch", "*.md"]

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "I", "F", "E", "W", "D", "UP", "ANN", "PYI"]
extend-ignore = ["ANN401"]  # Skip self/cls type annotations
per-file-ignores = { "tests/*.py" = ["ANN", "D"] }
mccabe = { max-complexity = 14 }
pydocstyle = { convention = "numpy" }

[tool.codespell]
skip = ".git,*.pdf,*.svg,./docs/build,uv.lock,scratch"

[tool.coverage.run]
# `sys.monitoring` measures lines at a fraction of the default tracer's cost.
core = "sysmon"

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short --cov=src --cov-report=term-missing --cov-fail-under=0"
testpaths = ["tests"]
# The fixtures this suite shares with the other package's.
pythonpath = ["../fixtures/shared"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore_module = true
fail-under = 30
exclude = [
  "__init__.py",
  "tests",
  "docs",
  "build",
  "examples",
  "site",
  "scratch",
  ".venv",
]

[tool.mypy]
files = ["src/escapewheel_aind"]
strict = true
show_error_codes = true
exclude = ["scratch"]

# The recipe extra's lookups, none of which ships types.
[[tool.mypy.overrides]]
module = ["aind_data_access_api.*", "codeocean.*", "s3fs"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.uv.sources]
# A sibling in this monorepo; nothing is published yet. Editable, as the writer declares its own
# two, so a change to the boundary is visible here without a reinstall.
escapewheel-writer = { path = "../escapewheel-writer", editable = true }
