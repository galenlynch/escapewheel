[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "escapewheel-reader"
description = "Tools to read escapewheel packets"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Allen Institute for Neural Dynamics" },
  { name = "Galen Lynch", email = "galen@galenlynch.com" },
]
classifiers = ["Programming Language :: Python :: 3"]
readme = "README.md"
version = "0.1.0"

dependencies = [
    "jsonschema>=4.26.0",
    # Clock alignment is array arithmetic (`clocks.py`), so numpy is a direct dependency
    # rather than one inherited from pyarrow, which no longer requires it.
    "numpy>=1.26",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
# A SQL engine is optional because a complete read path exists without one: the nested-type
# ban (R3 2.1) exists to keep a native reader viable in languages that lack DuckDB. Validation
# is SQL and lives in escapewheel-validator, which depends on this extra.
sql = ["duckdb>=1.5.5"]
polars = ["polars>=1.0"]
# Zarr is optional for the same reason: an array declares its shape, chunking and codecs in a
# JSON document, so what an array *is* costs nothing, and only reading values needs a library.
arrays = ["zarr>=3"]
# An array as an xarray Dataset, its axes as coordinates (`xarray_backend.py`). 2025.7 is the first
# release with the coordinate-transform indexes a tick axis needs.
xarray = ["xarray>=2025.7", "zarr>=3"]

[project.urls]
Repository = "https://github.com/galenlynch/escapewheel/"
Issues = "https://github.com/galenlynch/escapewheel/issues"

[project.scripts]
# 07 names the CLI `escapewheel`; later packages extend it with their own subcommands
# rather than claiming a different name.
escapewheel = "escapewheel_reader.scripts.cli:main"

[project.entry-points."xarray.backends"]
escapewheel = "escapewheel_reader.xarray_backend:EscapewheelBackend"

[dependency-groups]
types = [
    "mypy",
    "pyarrow-stubs>=20.0.0.20260819",
    "types-jsonschema>=4.26.0.20260518",
]
dev = [{ include-group = "types" }, "codespell", "pytest", "pytest-cov", "ruff", "interrogate"]
jupyter = [{ include-group = "dev" }, "ipykernel", "pip"]
docs = [
  { include-group = "dev" },
  "sphinx>=5.0",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "myst-parser",
  "furo",
]

[tool.escapewheel.copies]
# What this package copies from the specification's tree, a wheel being unable to read a file
# outside it: a path in this package = a path under `spec/`. `tools/copies.py` at the
# monorepo root writes them, and `tests/test_copies.py` checks that they agree.
"src/escapewheel_reader/descriptor.py" = "tools/checkers/descriptor.py"
"src/escapewheel_reader/schemas/physical_profile.schema.json" = "artifacts/physical_profile.schema.json"
"src/escapewheel_reader/schemas/physical_profiles/escapewheel-portable-v0.1.json" = "artifacts/physical_profiles/escapewheel-portable-v0.1.json"
"src/escapewheel_reader/schemas/sources.schema.json" = "artifacts/sources.schema.json"

[tool.hatch.build.targets.wheel]
packages = ["src/escapewheel_reader"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Markdown is prose; its code blocks illustrate rather than run.
extend-exclude = ["scratch", "*.md"]

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "I", "F", "E", "W", "D", "UP", "ANN", "PYI"]
extend-ignore = ["ANN401"]  # Skip self/cls type annotations
per-file-ignores = { "tests/*.py" = ["ANN", "D"] }
mccabe = { max-complexity = 14 }
pydocstyle = { convention = "numpy" }

[tool.codespell]
skip = ".git,*.pdf,*.svg,./docs/build,uv.lock,scratch"

[tool.coverage.run]
# `sys.monitoring` measures lines at a fraction of the default tracer's cost.
core = "sysmon"

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short --cov=src --cov-report=term-missing --cov-fail-under=0"
testpaths = ["tests"]
# The packet fixture this suite shares with the other package's.
pythonpath = ["../fixtures/shared"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore_module = true
fail-under = 30
exclude = [
  "__init__.py",
  "tests",
  "docs",
  "build",
  "examples",
  "site",
  "scratch",
  ".venv",
]

[tool.mypy]
files = ["src/escapewheel_reader"]
strict = true
show_error_codes = true
exclude = ["scratch"]

[[tool.mypy.overrides]]
module = "polars.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false


[[tool.mypy.overrides]]
# zarr, and the numcodecs it brings, are the `arrays` extra, absent on a table-only install.
module = ["zarr.*", "numcodecs.*"]
ignore_missing_imports = true
