[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "escapewheel-writer"
description = "Tools to write escapewheel packets"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Allen Institute for Neural Dynamics" },
  { name = "Galen Lynch", email = "galen@galenlynch.com" },
]
classifiers = ["Programming Language :: Python :: 3"]
readme = "README.md"
version = "0.1.0"

# The committer validates before it promotes (Part 05 §2), so the validator -- and through
# it the reader -- is a dependency rather than an optional extra.
dependencies = [
    "escapewheel-validator",
    "fsspec>=2026.7.0",
    "numpy>=1.26",
    "pyarrow>=25.0.1",
    "s3fs>=2026.7.0",
    "universal-pathlib>=0.3.10",
]

[project.optional-dependencies]
# The NWB adapter decodes Zarr v2 chunks directly, so it needs the codecs and nothing else:
# no zarr, no hdmf-zarr, no pynwb. See sources/zarr_compat.py.
nwb = ["numcodecs>=0.13"]
# Writing a packet-owned dense array needs a Zarr v3 writer (R21 §3.1); reading a v2 one
# still does not, which is what `sources/zarr_compat.py` exists for.
arrays = ["zarr>=3"]
# The Harp adapter reads only `device.yml`, the schema a Harp device writes beside its own data,
# so it needs a YAML parser and nothing more. Decoding the binary register streams would need a
# Harp library (`contraqctor`, `harp-python`); nothing here does, because the samples reach us
# through the NWB and what was missing was the declaration rather than the data.
harp = ["pyyaml>=6"]
# `escapewheel verify` reaches a store to record what is there (R36 §2.4), and `verify = "members"`
# on a remote uri_base does the same at build time. The client lives with the validator, which
# is where the verification code is; this only asks for it.
remote = ["escapewheel-validator[remote]"]
s3 = ["escapewheel-validator[s3]"]

# A third-party distribution ships an extension by registering two things. Both matter only
# while a packet is being *built*: once built, the packet embeds the registry document, and
# reading it needs nothing installed. That is the whole difference from an `ndx-` extension.
#
#   [project.entry-points."escapewheel.extensions"]
#   vr_foraging = "aind_vr_foraging:REGISTRY"        # the document, or a path to it
#
#   [project.entry-points."escapewheel.sources"]
#   vr_sites = "aind_vr_foraging.sources:SiteSource"  # only if a raw format needs parsing

[project.entry-points."escapewheel.commands"]
# 07 names one CLI. escapewheel-reader owns the console script and discovers this group.
import = "escapewheel_writer.scripts.cli:register"

[project.urls]
Repository = "https://github.com/galenlynch/escapewheel/"
Issues = "https://github.com/galenlynch/escapewheel/issues"

[dependency-groups]
types = [
    "mypy",
    "pyarrow-stubs>=20.0.0.20260819",
]
dev = [
    { include-group = "types" },
    "codespell",
    "numcodecs",
    "pytest",
    "pytest-cov",
    "ruff",
    "interrogate",
    "types-jsonschema>=4.26.0.20260518",
    "zarr>=3",
    "pytest-xdist",
]
jupyter = [{ include-group = "dev" }, "ipykernel", "pip"]
docs = [
  { include-group = "dev" },
  "sphinx>=5.0",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "myst-parser",
  "furo",
]

[tool.escapewheel.copies]
# What this package copies from the specification's tree, a wheel being unable to read a file
# outside it: a path in this package = a path under `spec/`. `tools/copies.py` at the
# monorepo root writes them, and `tests/test_copies.py` checks that they agree.
"src/escapewheel_writer/schemas/adapter.schema.json" = "artifacts/adapter.schema.json"
"src/escapewheel_writer/schemas/resources.schema.json" = "artifacts/resources.schema.json"
"src/escapewheel_writer/schemas/recipe.schema.json" = "artifacts/recipe.schema.json"

[tool.hatch.build.targets.wheel]
packages = ["src/escapewheel_writer"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Markdown is prose; its code blocks illustrate rather than run.
extend-exclude = ["scratch", "*.md"]

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "I", "F", "E", "W", "D", "UP", "ANN", "PYI"]
extend-ignore = ["ANN401"]  # Skip self/cls type annotations
per-file-ignores = { "tests/*.py" = ["ANN", "D"] }
mccabe = { max-complexity = 14 }
pydocstyle = { convention = "numpy" }

[tool.codespell]
skip = ".git,*.pdf,*.svg,./docs/build,uv.lock,scratch"

[tool.coverage.run]
# `sys.monitoring` measures lines at a fraction of the default tracer's cost.
core = "sysmon"

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short --cov=src --cov-report=term-missing --cov-fail-under=0"
testpaths = ["tests"]
# The NWB fixture this suite shares with the other package's.
pythonpath = ["../fixtures/shared"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore_module = true
fail-under = 30
exclude = [
  "__init__.py",
  "tests",
  "docs",
  "build",
  "examples",
  "site",
  "scratch",
  ".venv",
]

[tool.mypy]
files = ["src/escapewheel_writer"]
strict = true
show_error_codes = true
exclude = ["scratch"]

[[tool.mypy.overrides]]
# numcodecs ships no py.typed marker.
module = "numcodecs.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# zarr is the `arrays` extra, absent on a read-only install.
module = "zarr.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# fsspec ships no py.typed marker.
module = "fsspec.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyyaml is the `harp` extra, and ships no stubs of its own.
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false


[tool.uv.sources]
# Sibling repos; nothing is published yet.
escapewheel-validator = { path = "../escapewheel-validator", editable = true }
escapewheel-reader = { path = "../escapewheel-reader", editable = true }
