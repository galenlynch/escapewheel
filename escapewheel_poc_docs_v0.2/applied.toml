  { part = "05", section = "4.4", note = "what a build reports of a failure, per protocol, and every failure together" },
  { part = "05", section = "3.7", note = "standard error carries the diagnosis where rows have taken standard output" },
  { part = "09", section = "5.8", note = "the connection as a carrier beside the file, and a report cleared before the run" },
]

[clause."R115 §3.12"]
disposition = "applied"
