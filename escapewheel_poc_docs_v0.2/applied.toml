  { part = "03", section = "11.5", note = "the declaration document, its keys, and what a build refuses one for" },
  { part = "05", section = "3.4", note = "the four facts, and that an adapter a build cannot import publishes them" },
  { part = "05", section = "3.5", note = "the refusals a recipe check makes against a declaration" },
  { part = "09", section = "5.8", note = "`stated` carries the values behind the fields a source declares it states" },
]

[clause."R116 §2.1"]
disposition = "rationale"
note = "the NWB adapter's object is 322,799 bytes against a 131,072-byte argument on Linux and a 32,767-character command line on Windows; two of ten adapters exceed it and both for `units`"

[clause."R116 §2.2"]
disposition = "rationale"
note = "`units` grows with what a session produced where `clocks` grows with the rig, so a cap on the term is a cap on the science"

[clause."R116 §2.3"]
disposition = "rationale"
note = "standard input is free under all three protocols, is unbounded, and is the one channel that does not publish what it carries through /proc"

[clause."R116 §3.1"]
disposition = "applied"
where = [
  { part = "03", section = "11.2", note = "the object crosses on standard input, an adapter reads it to end of file, and no argument is added" },
]

[clause."R116 §3.2"]
disposition = "applied"
where = [
  { part = "05", section = "3.7", note = "a build writes and closes without waiting, and reads what the command produces while it writes" },
]

[clause."R117 §2.1"]
disposition = "rationale"
note = "Part 03 §11.3 said what an array reference carries and not through what, which stopped the three adapters holding 14.44 GB of a 0.59 GB packet's data"

[clause."R117 §2.2"]
disposition = "rationale"
note = "every field of a packet-owned array's manifest entry is in the array or in the build; the codec list read off the chain matches the entry's, descending through the shard"

[clause."R117 §2.3"]
disposition = "rationale"
note = "a row carries a referenced resource's location and cannot carry what the producer learned by opening the store, which is the catalog's and not a table's"

[clause."R117 §3.1"]
disposition = "applied"
where = [
  { part = "03", section = "11.3", note = "array_location per source, the name that is the identifier, the rows that must agree with it, and the manifest entry read off the array" },
]

[clause."R117 §3.2"]
disposition = "applied"
where = [
  { part = "03", section = "11.3", note = "the resource document, what a build requires of an entry, and why it is a delivery rather than a report" },
  { part = "03", section = "11.4", note = "`resources` as the second reserved resource identifier, and the single-row table it travels as" },
]

[clause."R117 §3.3"]
disposition = "applied"
where = [
  { part = "03", section = "11.3", note = "the published shape, and a build refusing a document that does not satisfy it" },
]

[clause."R118 §2.1"]
disposition = "rationale"
where = "R118 §2.1"
note = "as written under R110's rules, 173 of 365 and 182 of 372 columns sit 1.15x or more off their best encoding, most of them single-valued or empty columns no rule reaches; the 1.5x report found none because it compared one-column files rather than column chunks"

[clause."R118 §2.2"]
disposition = "rationale"
where = "R118 §2.2"
note = "a dictionary page costs 27 bytes in every row group, so a single-valued column repays one only past some tens of thousands of rows, the packets crossing between 41,275 and 76,646; below 50,000 rows delta suits a single-valued integer. Carried to 10 §2.8"

[clause."R118 §2.3"]
disposition = "rationale"
where = "R118 §2.3"
note = "a count over a whole column cannot see a climb within groups, so counts alone write the spike tables' t_tick plain at 1.24x to 1.30x, 384 MB over best; the _tick suffix, the structural_index and sequence_position roles and assigned identity mark such columns without stating a distribution. Carried to 10 §2.9"

[clause."R118 §2.4"]
disposition = "rationale"
where = "R118 §2.4"
note = "rules keyed on declarations alone leave 70 columns 1.15x off their best, since no declaration says how many rows share a value. Carried to 10 §2.10"

[clause."R118 §2.5"]
disposition = "rationale"
where = "R118 §2.5"
note = "declared order then counts leave 15 columns needing an exception against 193 as written, on a plateau and across packets, and every column then lands within 1.15x of its best. Writing each column three ways and keeping the smallest is not adopted: the rules record a reason, sharing only the sampled build's divergence. Carried to 10 §2.11, and the counting cost to 07 §7"

[clause."R118 §2.6"]
disposition = "rationale"
where = "R118 §2.6"
note = "BYTE_STREAM_SPLIT is 1.15x smaller on 4 float column-and-packet pairs and 1.15x larger on 34, and DELTA_BYTE_ARRAY is refused by hyparquet and fastparquet; neither is among the encodings Part 03 §5.5 permits, so no rule chooses either"

[clause."R118 §2.7"]
disposition = "rationale"
where = "R118 §2.7"
note = "a --sample 2000 build encodes 8 columns differently from its full build, seven within 1.04x of their sampled best and core.spike_events.amplitude plain at 1.56x to 1.60x, every other column staying within 1.15x. Carried to 10 §2.12"

[clause."R118 §3.1"]
disposition = "applied"
where = [{ part = "03", section = "5.5" }]
note = "a writer SHOULD choose from declarations and four counts over the rows it holds when it chooses, a streamed table's being the row group about to be written or the first where one encoding is kept for the file; the first of four rules that applies decides"

[clause."R118 §3.2"]
disposition = "applied"
where = [{ part = "03", section = "5.5" }]
note = "a column in which every row is null SHOULD be written plain"

[clause."R118 §3.3"]
disposition = "applied"
where = [{ part = "03", section = "5.5" }]
note = "a single-valued column SHOULD take a dictionary from 50,000 rows, and below that delta for an integer and plain otherwise"

[clause."R118 §3.4"]
disposition = "applied"
where = [{ part = "03", section = "5.5" }]
note = "an integer declared ordered by the _tick suffix, the leading identifier, the structural_index or sequence_position role or assigned identity, or observed never to decrease, SHOULD take delta, and plain where it holds 50 rows a run"

[clause."R118 §3.5"]
disposition = "applied"
where = [{ part = "03", section = "5.5" }]
note = "any other column, a float included, SHOULD take a dictionary where it holds 50 rows a distinct value and plain otherwise"

[clause."R118 §3.6"]
disposition = "applied"
where = [{ part = "03", section = "5.5" }]
note = "the report SHOULD measure a column's own chunks and judge a string, timestamp or date column between a dictionary and plain; R110 §3.3's override and R110 §3.4's recipe declaration stand"

[clause."R119 §2.1"]
disposition = "rationale"
where = "R119 §2.1"
note = "declaring a name in needs is what makes a recipe carry it, since a build refuses a recipe where a declared name resolves to neither a term nor an option the entry sets, so an option holding a default cannot be declared at all. R115 §3.1's NWB example of six declared names with two options never shipped: the declaration has read five names with zone its only option since NEEDS was introduced, and interval_kind has never been among them"

[clause."R119 §2.2"]
disposition = "rationale"
where = "R119 §2.2"
note = "the ten adapters take 32 constructor options beyond what they declare — nwb 7, waveforms 6, sorter 5, sync 5, lfp 4, tables 3, video 2 — of which 28 are the recipe's to set and none lacks a default; two adapters declare an option at all and both declare zone, and the two packaged recipes set 10 distinct names between them"

[clause."R119 §2.3"]
disposition = "rationale"
where = "R119 §2.3"
note = "both construction paths pass the recipe's options through as keyword arguments, so a misspelled option raises TypeError inside the adapter once the build is running rather than being refused before any source is opened, naming a class rather than the recipe entry; all ten adapters refuse an unknown keyword, none taking a keyword catch-all, so the catch is reliable and its timing is not"

[clause."R119 §2.4"]
disposition = "rationale"
where = "R119 §2.4"
note = "a sampled build adds sample to the sorter source's options, and sample is in no adapter's declaration and is not one of Part 03 §11.2's terms, so the reference build supplies a name the adapter never declared"

[clause."R119 §2.5"]
disposition = "rationale"
where = "R119 §2.5"
note = "waveforms needs an option naming the sorter's label column and base NWB carries none: the Units table's id is arange(n), differing from ks_unit_id in 6,775 of 6,781 and 4,138 of 4,505 rows, and unit_name holds a UUID in both files, while the probe half of the pair is derivable from the electrodes region in 6,781 of 6,781 and 4,505 of 4,505 units. lfp needs the same shape for a series name. Both options hold a default, so neither can be declared"

[clause."R119 §3.1"]
disposition = "applied"
where = [{ part = "03", section = "11.2" }, { part = "07", section = "4" }]
note = "an adapter MUST declare in accepts every option it reads and can be constructed without and in needs every value it cannot, MUST NOT name one option in both or a term in accepts, and MUST apply its own default where the recipe sets no value; Part 07 §4 carries the reference spelling ACCEPTS"

[clause."R119 §3.2"]
disposition = "applied"
where = [{ part = "03", section = "11.2" }, { part = "05", section = "3.5" }]
note = "a build MUST supply an option the recipe sets and the adapter names in either list, MUST refuse a recipe setting an option the adapter names in neither, naming the source and the option, before any source is opened, and MUST NOT require a recipe to set one named in accepts"

[clause."R119 §3.3"]
disposition = "applied"
where = [{ part = "03", section = "11.2" }]
note = "a build MUST NOT supply an option the adapter names in neither list, including one it adds itself rather than reading from the recipe, and MUST NOT apply a facility of its own to an adapter that does not name the option carrying it"

[clause."R119 §3.4"]
disposition = "applied"
where = [{ part = "03", section = "11.5" }, { part = "05", section = "3.4" }, { part = "05", section = "3.5" }]
note = "the declaration document carries accepts beside needs, a build MUST read a document without it as an adapter accepting no option, and MUST refuse one whose accepts names a term, names an option its needs also names, or is not an array of names; an adapter declares five facts rather than four"
