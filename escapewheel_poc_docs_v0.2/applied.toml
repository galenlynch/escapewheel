  { part = "05", section = "4.4", note = "the ownership set as the expectation, the empty delivery, and a non-zero exit" },
  { part = "03", section = "11.4", note = "the reserved `end` stream, since a reader treats end of file as end of stream" },
]

[clause."R115 §3.11"]
disposition = "applied"
