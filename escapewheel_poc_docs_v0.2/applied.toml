note = "core declares no device detail table; check.py checks that no core table but core.devices is keyed beginning device_id, taking structural invariants from 28 to 29"

[clause."R104 §3.3"]
disposition = "rationale"
where = "R104 §3.3"
note = "a writer sets device_kind where it writes a detail row and not otherwise; a fact no detail table models stays in metadata, and a rule or query needing to read it is what justifies promoting it"

[clause."R105 §2.1"]
disposition = "rationale"
where = "R105 §2.1"
note = "R19 §3 named the axes x_um, y_um, z_um in every frame and left their meaning to the frame's own definition, which none of the three reserved names -- probe, ccf, stereotaxic -- carries anywhere a consumer can read"

[clause."R105 §2.2"]
disposition = "rationale"
where = "R105 §2.2"
note = "the only statement of the mapping is CCF_AXES in the writer's NWB adapter; under it x_um holds ML at 1,828-5,780 um and y_um holds AP at 2,580-9,360, and both fall inside both extents, so reading them in the CCFv3 volume's order places every electrode somewhere plausible and wrong"

[clause."R105 §2.3"]
disposition = "rationale"
where = "R105 §2.3"
note = "coordinate_frame sat in both coordinate tables' primary keys, carried role data and declared no reference, so R46 §2 applies: a packet spelling the frame ccf in one table and CCF in the other holds two frames no check compares"

[clause."R105 §2.4"]
disposition = "rationale"
where = "R105 §2.4"
note = "8,448 of 27,557 coordinate rows -- 31% -- carry a null z_um, those being the probe rows whose axes are rel_x and rel_y; a Neuroglancer space is routinely five-dimensional, and core.array_dimensions already shows what R3 §3.0's child table looks like for an axis"

[clause."R105 §2.5"]
disposition = "rationale"
where = "R105 §2.5"
note = "a Stage 1 survey found the sources name the field each value came from and nothing else: the NWB says 'rel_x from merged', Open Ephys offers ELECTRODE_XPOS, the preprocessed record carries none of ProbeInterface's ndim or contact_plane_axes, and ccf_coordinate_transform is null in rig.json, session.json and processing.json alike"

[clause."R105 §3.1"]
disposition = "applied"
where = [{ part = "01", section = "3.24" }]
note = "core.coordinate_frames keyed (session_id, coordinate_frame), with atlas and atlas_version as declared facts rather than a spelling of the name; both coordinate tables now reference it, so a frame no packet declares is an orphan Tier 1 reports, and 02 §11.9 indexes the two frame tables"

[clause."R105 §3.2"]
disposition = "applied"
where = [{ part = "02", section = "12.7" }]
note = "core.coordinate_frame_axes keyed (session_id, coordinate_frame, axis_index), one row per axis; axis_name required and axis_direction nullable, with core.coordinate_frame_axes.axis_names_distinct taking Tier 2 rules from 76 to 77"

[clause."R105 §3.3"]
disposition = "applied"
where = [{ part = "01", section = "3.8" }]
note = "core.electrode_coordinate_values and core.unit_coordinate_values, each keyed by its parent's key plus axis_index and referencing the axis row, so a value on an undeclared axis is an orphan; x_um, y_um and z_um struck from both parents, and axis_value declares unit_from of core.coordinate_frame_axes.unit through R56 §2.3's one hop"

[clause."R105 §3.4"]
disposition = "applied"
where = [{ part = "01", section = "3.24" }]
note = "axis_name is whatever the source called the field, verbatim (R22 §3), so the source's column name becomes a value in the packet; unit is known by construction, and axis_direction MUST be left null where the source does not state it, which binds the writer and no validator (R67 §2.4)"

[clause."R105 §3.5"]
disposition = "applied"
where = [{ part = "01", section = "3.24" }]
note = "a consumer needing an axis's direction where none is declared reports the coordinate unusable rather than assuming a convention, which is R83 §2.3's rule for a run declaring no channels"

[clause."R106 §2.1"]
disposition = "rationale"
where = "R106 §2.1"
note = "of 351 core and 161 extension columns, animal_response is the only one whose values are codes for something the packet does not name; core.array_dimensions.step_tick_den is a denominator and aind_unit_qc.synchrony.synchrony_size a count of units"

[clause."R106 §2.2"]
disposition = "rationale"
where = "R106 §2.2"
note = "counting licks between go_cue_start_tick and reward_outcome_tick, no trial of the 1,158 contradicts the reading: no 0 trial has a right lick and no left, no 1 trial the reverse, and all 249 of the 2 trials are silent"

[clause."R106 §2.3"]
disposition = "rationale"
where = "R106 §2.3"
note = "the column declared vocabulary open on an int32, the one place in the registry that did, struck at R101's acceptance because an integer's values are not a vocabulary this format can describe"

[clause."R106 §3.1"]
disposition = "applied"
where = [{ part = "02", section = "8.7" }]
note = "a writer that can decode MUST store the decoded value; one that cannot stores the token verbatim in a string column declaring an open vocabulary, an integer being unable to declare a vocabulary at all (§9.3). No rule checks either half, nothing structural telling a code from a count"

[clause."R106 §3.2"]
disposition = "registry"
where = "dynamic_foraging.trials.animal_response"
note = "int32 becomes string with vocabulary closed over left/right/no_response, staying nullable and role data; closed on R8 §3's test since a two-spout task admits no fourth outcome, so a packet embedding this extension runs 5 closed-vocabulary checks where it ran 4 while the generated core count stays at 4, and a null is not a no_response. No adapter here writes the table -- a TablesSource reads a Parquet file each session's extract.py produces -- so the type change is what refuses a packet whose codes were never decoded"

[clause."R107 §2.1"]
disposition = "rationale"
where = "R107 §2.1"
note = "five requirements are made of a column's description and four hold what a field holds: R101 §3.5's nomenclature is `authority`, its closed-set clause is `vocabulary` and `enum`, R48 §2.5's base is `role`, and R7 §2's reason has no field at all; only the form the values take survives contact with one"

[clause."R107 §2.2"]
disposition = "rationale"
where = "R107 §2.2"
note = "R101 §3.6 says a nomenclature is a value rather than prose, one subsection after §3.5 requires the description to name it; nothing compared them because check.py carried one invariant about a description, that an open column has one"

[clause."R107 §2.3"]
disposition = "rationale"
where = "R107 §2.3"
note = "50 restatements over 45 distinct columns -- 35 of `vocabulary`, 10 of `authority`, 2 of `resolves`, 2 of `reserved_values`, 1 of `enum` -- of which 39 agree with the field and six do not, all six written before the revision that settled what their column declares"

[clause."R107 §2.4"]
disposition = "rationale"
where = "R107 §2.4"
note = "registry/tables.md rendered Column, Type, Presence, Since and Description and no declaration at all, which is what the prose was buying: core.processing_runs.status's three values reached a reader of that document only because someone typed them beside the enum holding them"

[clause."R107 §2.5"]
disposition = "rationale"
where = "R107 §2.5"
note = "a table declares columns, primary_key, references, rules and since, and R2 §9's meta-schema sets additionalProperties false, so R7 §2's reason has had nowhere to go since the meta-schema was published; no table declares primary_key null, which is why nothing reached it"

[clause."R107 §2.6"]
disposition = "rationale"
where = "R107 §2.6"
note = "R56 §1 opens on the same defect one field over -- R48 gave a column a role and left the clock and the unit as prose -- with a live pipeline's every unit inside a Field(description=...) as its evidence"

[clause."R107 §3.1"]
disposition = "applied"
where = [{ part = "02", section = "3" }]
note = "one MUST NOT replaces R101 §3.5's second and third sentences and R48 §2.5, enforced by one new check.py invariant taking the structural checks from 29 to 30 and reaching `vocabulary`, `resolves` and `enum` exactly; naming a declared value is not restating one where the description says what that value means, which is why core.array_assets.band keeps `wideband`, `ap` and `lfp` and core.processing_runs.status loses its three"

[clause."R107 §3.2"]
disposition = "registry"
where = "the five discriminator descriptions"
note = "core.intervals.interval_kind, both scope_kinds and both detail_kinds stop calling their values open; R55 §2.1 fixes them to the declared resource IDs, so none of the three words is true of them, and R100 §2.1's two and R104 §3.1's one already had this form"

[clause."R107 §3.3"]
disposition = "applied"
where = [{ part = "02", section = "9.3" }]
note = "authority becomes an array of {name, uri}, both required, on 12 columns naming 5 nomenclatures; R53 §2.3.1's shape one level over, since neither informatics.jax.org nor rgd.mcw.edu contains the name of the registry it serves and no rule derives MGI or RGD from a URI"

[clause."R107 §3.4"]
disposition = "applied"
where = [{ part = "02", section = "9.3" }]
note = "tables.md renders each field, generated so the two cannot disagree"

[clause."R107 §3.5"]
disposition = "superseded"
where = "02_core_logical_schemas.md §2"
note = "R7 §2's requirement that a keyless table state its reason in a description is struck rather than given a field: a table-level description would recreate at table level what §3.1 corrects at column level. primary_key null is the declaration and `since` names the revision that set it (R29 §2)"

[clause."R108 §2.1"]
disposition = "rationale"
where = "R108 §2.1"
note = "prefer the session adapter for core.subjects and an asset without subject.json stages no subject at all, so core.sessions.subject_id orphans and the finding lands on the table that was staged, naming neither the preference nor the source it named"

[clause."R108 §2.2"]
disposition = "rationale"
where = "R108 §2.2"
note = "of five PREFERRED entries, three name resources _resolve_ownership never consults because SHARED is checked first, one named a resource a single adapter produces, and core.probes is the only one that arbitrates -- while _note_unclaimed exempts all five from R98 §3.3's report"

[clause."R108 §2.3"]
disposition = "rationale"
where = "R108 §2.3"
note = "seven of the eight contests carry a SHARED entry, a PREFERRED entry or both; core.subjects carries neither, which is the state R87 §2.8 created so a source may own it and R63 §2.3's warning fires"

[clause."R108 §2.4"]
disposition = "rationale"
where = "R108 §2.4"
note = "the NWB and subject.json agree on every declared column for both animals -- Mus musculus, male from M and Male, wt/wt, the birth dates, strain null in both -- so the refusal fires on neither packet, which is what makes a MUST safe rather than a SHOULD"

[clause."R108 §3.1"]
disposition = "applied"
where = [{ part = "05", section = "3.4" }]
note = "a build refuses where a passed-over row holds a non-null value in a column the preferred row leaves null, or the preferred source stages nothing; over declared columns only, metadata being schemaless. Bounded by §3.4: every preferred resource is metadata-scale, and core.clock_anchors at 754,222 rows carries no preference"

[clause."R108 §3.2"]
disposition = "applied"
where = [{ part = "05", section = "3.4" }]
note = "a build MUST NOT compose a row from more than one source; the merged row would be a fact no source stated, which is the inference R83 §2.2, R67 §2.4 and R105 §3.4 each refuse"

[clause."R108 §3.3"]
disposition = "applied"
where = [{ part = "05", section = "3.4" }]
note = "an [overrides] entry silences §3.1's refusal for the fact it names, a second use of R87 §2.5's table: there the recipe is authoritative over a source, here the preferred source over the one it displaced. Per fact, which is the granularity §3.1's refusal names"

[clause."R108 §3.4"]
disposition = "applied"
where = [{ part = "05", section = "3.3" }]
note = "a preference MUST NOT name a resource only one source produces; core.unit_electrodes is struck from recipe.PREFERRED, five entries becoming four, and one test enumerates the table against every adapter's PRODUCES so it cannot go stale again"

[clause."R109 §2.1"]
disposition = "rationale"
where = "R109 §2.1"
note = "four parts hold one piece each and none holds the shape: R17 §2 makes an extension a registry document, 09 §5.2 namespaces it, 09 §5.3 has a packet declare it, 05 §3.4 has an adapter declare PRODUCES, and 09 §5.1 observes no code is needed -- so an implementation resolving an extension only through an installed distribution contradicted no clause"

[clause."R109 §2.2"]
disposition = "rationale"
where = "R109 §2.2"
note = "both recipes supply all six extension tables -- dynamic_foraging.trials, .blocks, .sessions and aind_unit_qc.metrics, .waveform_metrics, .synchrony -- through a source of kind tables, and no distribution registers an extension registry under the entry-point group at all, so the decoupled path carries everything"

[clause."R109 §2.3"]
disposition = "rationale"
where = "R109 §2.3"
note = "an extension running in the writer's process resolves its dependencies against the writer's environment, and two extensions pinning incompatible versions make it unsolvable; solving it out of process costs nothing because R53 §2.5 mints every assigned identifier after an extension has finished"

[clause."R109 §2.4"]
disposition = "rationale"
where = "R109 §2.4"
note = "67 notes in ecephys_776259's build and 49 in ecephys_786867's, of which the tables source supplying six of forty tables contributes one, saying only that the command ran; the command's own output inherits the build's streams and lands unattributed, and a non-zero exit reaches the build as a status alone"

[clause."R109 §3.1"]
disposition = "applied"
where = [{ part = "09", section = "5.6" }]
note = "a writer MUST be able to build from a registry document and rows as files alone, and MUST NOT require an extension to be installed, importable or resolvable; code is a MAY that MUST NOT be the ordinary case, which is what makes 09 §5.1's 'needs no code' a promise"

[clause."R109 §3.2"]
disposition = "applied"
where = [{ part = "09", section = "5.7" }]
note = "an extension delivers a registry document and Parquet, with a command where a raw source needs converting; identifiers arrive as names (R53 §2.5). An extension MUST NOT derive the document from the rows it delivers -- aind_unit_qc.waveform_metrics declares 13 columns where the extraction delivers 10, and a derived document would assert the extension has no half_width"

[clause."R109 §3.3"]
disposition = "applied"
where = [{ part = "05", section = "3.7" }]
note = "a non-zero exit MUST fail the build and the build MUST name the source, not the first missing resource: one tables source's command produces six tables across two extensions in both recipes, so naming an extension would be wrong about half of them"

[clause."R109 §3.4"]
disposition = "applied"
where = [{ part = "05", section = "3.7" }]
note = "a build MUST capture both streams and report them with a failure, and SHOULD keep them readable on success; to a file rather than memory, so a long command still streams. Binds the build alone -- §2.4 measures that the account exists and only its custody is missing"

[clause."R109 §3.5"]
disposition = "applied"
where = [{ part = "09", section = "5.8" }]
note = "an extension MAY validate its own tables on core's terms (R17 §4) and a build MUST NOT rely on it, its own validation running over every staged resource whatever produced it"

[clause."R109 §3.6"]
disposition = "applied"
where = [{ part = "09", section = "5.8" }]
note = "a report is optional to produce and reported when present, R51 §2.2's shape for store_digest; it carries what a build cannot derive -- what the command read, skipped and why -- since rows per table come from the footer at Stage 1. JSON with problems[] at R2 §7.3's levels and read[], and unrecognised keys MUST NOT be refused"

[clause."R109 §3.7"]
disposition = "applied"
where = [{ part = "09", section = "5.7" }]
note = "an extension's command MUST be a function of its inputs, splitting determinism as R75 does: §2.1 binds what the program computes, §2.2 leaves pinning the environment a build property no packet is judged on. An extension that cannot be delivers a file produced beforehand. Nothing checks it, which is R67 §2.4's shape"

[clause."R110 §2.1"]
disposition = "rationale"
where = "R110 §2.1"
note = "R10 §2 sorts a table by its key so the first key column ascends across the whole table, which is what delta exists for; measured on ecephys_776259, a dictionary over core.unit_coordinates.unit_id costs 30.95 bits a row for an int32, and delta is 37x to 79x smaller across six identifier columns. Carried to 10 §2.4"

[clause."R110 §2.2"]
disposition = "rationale"
where = "R110 §2.2"
note = "of the 32 float columns reaching 2 kB under pyarrow's default, 27 are smaller written plain by 1.15x to 1.76x; the five that repeat decide more, core.spike_events.amplitude being quantised to the sorting run's step and 1.85x better with the dictionary across 209 MB. Carried to 10 §2.5"

[clause."R110 §2.3"]
disposition = "rationale"
where = "R110 §2.3"
note = "the two spike tables are 1,168 MB of ecephys_776259 and read behind a filter; the other 38 tables are 1.375 MB and read entire, 2.622 MB under the default, so the rules take 1.91x off what an open transfers. Decode is 15.6 ms against 15.8 ms, and round trips are unchanged. Carried to 10 §2.6"

[clause."R110 §2.4"]
disposition = "rationale"
where = "R110 §2.4"
note = "deriving the encoding from the sort key was measured over the 116 column-and-packet pairs reaching 2 kB under either choice and picked worse on 82, regressing core.media_frames.pts 188x and core.clock_anchors.t_tick 57x, both monotone without being key columns. Carried to 10 §2.7"

[clause."R110 §2.5"]
disposition = "rationale"
where = "R110 §2.5"
note = "measuring every column three ways over a 65,536-row sample costs about 0.4 s a packet against a 467 s build, so cost is not what refuses it: the choice records no reason and differs between a --sample build and a full one. A property of one implementation's libraries, so carried to 07 §7 rather than 10 (R93 §3.5)"

[clause."R110 §3.1"]
disposition = "superseded"
by = "R118"
note = "the leading identifier survives as one of R118 §3.4's declarations of order, delta-encoded unless its runs are long"

[clause."R110 §3.2"]
disposition = "superseded"
by = "R118"
note = "a float is judged by repetition under R118 §3.5, taking a dictionary where each value covers 50 rows"

[clause."R110 §3.3"]
disposition = "applied"
where = [{ part = "03", section = "5.5" }]
note = "a writer MUST be able to override each rule per column and every override MUST record what it measured and on what; a writer SHOULD refuse an exception naming a column no table declares, which is decidable with no packet in hand"

[clause."R110 §3.4"]
disposition = "applied"
where = [{ part = "05", section = "3.8" }]
note = "a recipe MAY declare a column's encoding in an [encoding] table keyed resource.column, each entry naming delta, plain or dictionary and carrying a reason. The recipe rather than the extension because a writer requires no code of an extension (R109 §3.1), and rather than the schema because an encoding is a fact about one packet's values"

[clause."R110 §3.5"]
disposition = "applied"
where = [{ part = "03", section = "5.5" }]
note = "a writer SHOULD report at info a column costing more than 1.5x the smallest encoding available to it, over a sample of the rows it wrote. A report and not a refusal, since every encoding is permitted and a packet is conforming whichever it uses"

[clause."R111 §2.1"]
disposition = "rationale"
where = "R111 §2.1"
note = "05 §10 makes a validator's report turn on telling a packet obligation from a writer's, and 05 spread its own writing-side obligations over 8 clauses binding a writer, 12 a build and 3 an importer, with nothing saying whether those were one actor or three"

[clause."R111 §2.2"]
disposition = "rationale"
where = "R111 §2.2"
note = "the read side already split by part -- 01 binds 19 clauses to a consumer and 2 to a reader, 03 binds 6 to a reader and none to a consumer -- because a reader is bound by what it returns and a consumer by what it concludes, a distinction load-bearing for R58 §2.2 and stated nowhere"

[clause."R111 §2.3"]
disposition = "rationale"
where = "R111 §2.3"
note = "45 clauses named neither an actor nor the part they constrain: 8 whose subject is an abstract process, and 38 in the agentless passive, of which 25 elide an actor the roster names and 12 name an artifact while hiding which part of it and what it must do"

[clause."R111 §3.3"]
disposition = "applied"
where = [{ part = "00", section = "2.8" }]
note = "the roster itself -- writer, reader, validator, consumer, and build/adapter/implementation resolving to them -- lands here as definitions carrying no modal, which is why only the rules that bind it are disposed. Every requirement binds an actor or states a property of an artifact, and an artifact predicate MUST name the part it constrains and put the constraint in an active verb -- a wall-clock column MUST NOT use INT96, over INT96 MUST NOT be used. Binds whoever writes this specification; a clause failing it is corrected rather than reported"

