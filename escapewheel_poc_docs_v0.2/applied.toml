# The most undisposed clauses ever allowed. Lowered automatically; never raised by hand.
[baseline]
undisposed = 0
# Applied targets the part does not corroborate by citing the revision. Same rule: may shrink.
#
# Not a backlog to clear. 41 of these are R111 §3.5's actor sweep, which rewrote sentences in 41
# sections and stamped none, because a revision that changes who a clause binds leaves no rule to
# credit. Most of the rest are a section stating a rule an earlier revision set and crediting the
# later one that reset it -- Part 03 §6.4 carries R3 §7.2's codec floor and credits R21 §3, which
# made it per-version. What the number catches is a target that is simply wrong, which is how
# eight were found: four clauses filed at Part 05 §8, which is Stage 7: Materialize.
uncorroborated = 77

