where = [
  { part = "03", section = "11.3", note = "a delivery's column set is a statement, and what a build settles on arrival" },
  { part = "07", section = "4", note = "the return type stays records, and the conversion that keeps a column" },
]

[clause."R115 §3.7"]
disposition = "applied"
where = [{ part = "03", section = "11.3", note = "identifiers cross as the names the source used" }]

[clause."R115 §3.8"]
disposition = "applied"
where = [{ part = "03", section = "11.3", note = "an array crosses as a reference to a location the build supplied" }]

[clause."R115 §3.9"]
disposition = "applied"
where = [
  { part = "03", section = "11.6", note = "the retry rendezvous, and that an adapter binds only when it can answer" },
  { part = "07", section = "4", note = "a protocol is named by a constant the implementation exports" },
]
note = "that a writer ships each end and that using it is nobody's condition of conformance is Part 03 §11.1's group plus this"

[clause."R115 §3.10"]
disposition = "applied"
