[clause."R115 §2.1"]
disposition = "rationale"
note = "the writer's own adapters resolve 57 distributions from five declared dependencies, so authorship is not what keeps a closure small"

[clause."R115 §2.2"]
disposition = "rationale"
note = "which institute's or tool's files each adapter reads, and that the boundary runs inside the NWB module rather than around it"

[clause."R115 §2.3"]
disposition = "rationale"
note = "the `session` kind reads one institute's schema; recorded so a rename is not invented later as a new idea, and nothing in the decision turns on it"

[clause."R115 §2.4"]
disposition = "rationale"
note = "four tables keyed by kind hold an adapter's own property where the adapter is not"

[clause."R115 §2.5"]
disposition = "rationale"
note = "a registered adapter is constructed with a root and options and reaches none of the extras a built-in gets by name"

[clause."R115 §2.6"]
disposition = "rationale"
note = "35 resources produced, 8 contested, 2 needing arbitration, which no adapter can declare of itself"

[clause."R115 §3.1"]
disposition = "applied"
where = [
  { part = "03", section = "11.2", note = "the closed vocabulary, how a declared name resolves, what a build refuses, and the one JSON object" },
  { part = "05", section = "3.4", note = "the four facts an adapter declares, one of them the values a build supplies" },
]
note = "the supply contract; Part 07 §4 keeps the reference spelling. One sentence of it is gone: R116 §3.1 replaced the channel the object crosses by, and the rest of the clause stands"

[clause."R115 §3.2"]
disposition = "applied"
where = [{ part = "05", section = "3.3", note = "a preference is declared in the recipe and a build holds none of its own" }]

[clause."R115 §3.3"]
disposition = "applied"
where = [
  { part = "03", section = "11.1", note = "the group, its three protocols, the asymmetry, and versioning by name" },
  { part = "09", section = "5.7", note = "an extension may deliver over any protocol of the group" },
]

[clause."R115 §3.4"]
disposition = "applied"
where = [{ part = "05", section = "3.7", note = "a command is carried as a list and never split from a string" }]

[clause."R115 §3.5"]
disposition = "applied"
where = [{ part = "05", section = "3.9", note = "the in-process opt-in is the recipe author's, and a build that cannot import refuses" }]

[clause."R115 §3.6"]
