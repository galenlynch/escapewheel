# Exact legacy cases in which an applied target does not cite the revision whose clause the
# ledger places there. Each target still resolves. A later revision may have replaced the
# provenance citation without replacing the rule, and R111's actor sweep deliberately changed
# who sentences bind without claiming ownership of the underlying rules. Adding or retaining an
# exception requires review; ledger.py rejects both an unlisted case and a stale listed case.

