# Sections that have moved, so a citation written before a move still resolves.
#
# Kept apart from `applied.toml` deliberately. That file is a compliance record: which clause of
# which revision landed where, written once at acceptance and never rewritten. This file is
# document history: what has moved since, independent of any revision. Overloading the first with
# the second rewrites the record -- `05` §11 was renumbered by an editorial fix with no revision to
# hang it on, and four of R82's dispositions were edited to say §12, which is where the clauses are
# now and not where R82 put them.
#
# `ledger.py` resolves a `where` through these before checking it exists, and
# `revisions/check_citations.py` resolves a citation the same way. A move is transitive: if §11
# became §12 and §12 later became §13, a citation of §11 resolves to §13.
#
# A move needs a coordinate to mean anything, and the specification's coordinate is its revision
# number: `derived_from.revisions` in the registry is a 109-entry vector whose last element says
# which state the parts are in. `at` names that, so a move is placed rather than dated -- a date
# is not what a citation is written against.
#
# **A number that has moved is retired and MUST NOT be reissued.** That is what lets a citation of
# `05` §11 resolve without knowing which revision it was written against, and it is the reason
# this table needs no per-citation version. A part that reused a retired number would make every
# older citation of it ambiguous, and nothing could tell the two apart.

[[move]]
part = "05"
from = "11"
to = "12"
at = "editorial, after R110 and before R111"
why = "R82's acceptance appended a second section numbered 11, so the part carried two; the appended one, `Alternatives are resolved before a commit`, is the one renumbered"
