content_class = "extension"
kind = "table"
instances = { mode = "singleton", presence = "optional" }
requires = []
lineage = "optional"
primary_key = ["block_id"]
amendment_groups = [["block_id"]]

[[columns]]
name = "session_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.sessions"
description = "Session ID."

[[columns]]
name = "block_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = { resource = "core.intervals", column = "interval_id", specialises = "core.intervals.interval_kind" }
description = "The block, and the interval it occupies in core, which carries its clock, bounds and name."

[[columns]]
name = "reward_probability_left"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit = "1"
description = "Left reward probability across the block."

[[columns]]
name = "reward_probability_right"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit = "1"
description = "Right reward probability across the block."

[[rules]]
id = "dynamic_foraging.blocks.in_its_intervals_session"
level = "error"
message = "a block's session is not the session of the interval it occupies"
sql = '''
SELECT b.session_id, b.block_id, c.session_id AS interval_session_id
FROM dynamic_foraging.blocks AS b
JOIN core.intervals AS c ON c.interval_id = b.block_id
WHERE c.session_id <> b.session_id'''

[[rules]]
id = "dynamic_foraging.blocks.blocks_do_not_overlap"
level = "error"
message = "two blocks of one session overlap, so a trial falls in both"
sql = '''
SELECT a.session_id, a.block_id, b.block_id AS other
FROM dynamic_foraging.blocks AS a
JOIN dynamic_foraging.blocks AS b ON a.session_id = b.session_id
  AND a.block_id < b.block_id
JOIN core.intervals AS ca ON ca.interval_id = a.block_id
JOIN core.intervals AS cb ON cb.interval_id = b.block_id
WHERE ca.start_tick <= cb.stop_tick
  AND cb.start_tick <= ca.stop_tick'''

[[rules]]
id = "dynamic_foraging.blocks.contains_its_trials"
level = "error"
message = "a trial names a block whose interval does not contain it"
sql = '''
SELECT t.session_id, t.trial_id
FROM dynamic_foraging.trials AS t
JOIN core.intervals AS cb ON cb.interval_id = t.block_id
JOIN core.intervals AS c ON c.interval_id = t.trial_id
WHERE c.start_tick < cb.start_tick
  OR c.stop_tick > cb.stop_tick'''
