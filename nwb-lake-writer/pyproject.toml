[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nwb-lake-writer"
description = "Tools to write NWB lakes"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Allen Institute for Neural Dynamics" },
  { name = "Galen Lynch", email = "galen@galenlynch.com" },
]
classifiers = ["Programming Language :: Python :: 3"]
readme = "README.md"
version = "0.1.0"

# The committer validates before it renames (05 Stage 5), so the validator -- and through
# it the reader -- is a dependency rather than an optional extra.
dependencies = [
    "nwb-lake-validator",
    "numpy>=1.26",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
# The NWB adapter decodes Zarr v2 chunks directly, so it needs the codecs and nothing else:
# no zarr, no hdmf-zarr, no pynwb. See sources/zarr_compat.py.
nwb = ["numcodecs>=0.13"]
# Writing a packet-owned dense array needs a Zarr v3 writer (R21 §3.1); reading a v2 one
# still does not, which is what `sources/zarr_compat.py` exists for.
arrays = ["zarr>=3"]

[project.entry-points."nwb_lake.commands"]
# 07 names one CLI. nwb-lake-reader owns the console script and discovers this group.
import = "nwb_lake_writer.scripts.cli:register"

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/nwb-lake-writer/"
Issues = "https://github.com/AllenNeuralDynamics/nwb-lake-writer/issues"
Changelog = "https://github.com/AllenNeuralDynamics/nwb-lake-writer/blob/main/CHANGELOG.md"

[project.scripts]
# Add your CLI scripts here, e.g.:
# my_command = "nwb_lake_writer.scripts.my_command:main"

[dependency-groups]
types = [
    "mypy",
    "pyarrow-stubs>=20.0.0.20260819",
]
dev = [{ include-group = "types" }, "codespell", "numcodecs", "pytest", "pytest-cov", "ruff", "interrogate"]
jupyter = [{ include-group = "dev" }, "ipykernel", "pip"]
docs = [
  { include-group = "dev" },
  "sphinx>=5.0",
  "sphinx-autodoc-typehints",
  "sphinx-copybutton",
  "myst-parser",
  "furo",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nwb_lake_writer"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["scratch"]

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "I", "F", "E", "W", "D", "UP", "ANN", "PYI"]
extend-ignore = ["ANN401"]  # Skip self/cls type annotations
per-file-ignores = { "tests/*.py" = ["ANN", "D"] }
mccabe = { max-complexity = 14 }
pydocstyle = { convention = "numpy" }

[tool.codespell]
skip = ".git,*.pdf,*.svg,./docs/build,uv.lock,scratch"

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short --cov=src --cov-report=term-missing --cov-fail-under=0"
testpaths = ["tests"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore_module = true
fail-under = 30
exclude = [
  "__init__.py",
  "tests",
  "docs",
  "build",
  "examples",
  "site",
  "scratch",
  ".venv",
]

[tool.commitizen]
version_provider = "pep621"
update_changelog_on_bump = true
tag_format = "v$version"
major_version_zero = true


[tool.mypy]
files = ["src/nwb_lake_writer"]
strict = true
show_error_codes = true
exclude = ["scratch"]

[[tool.mypy.overrides]]
# numcodecs ships no py.typed marker.
module = "numcodecs.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# zarr is the `arrays` extra, absent on a read-only install.
module = "zarr.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false


[tool.uv.sources]
# Sibling repos; nothing is published yet.
nwb-lake-validator = { path = "../nwb-lake-validator", editable = true }
nwb-lake-reader = { path = "../nwb-lake-reader", editable = true }
