content_class = "analysis"
kind = "table"
instances = { mode = "singleton", presence = "optional" }
requires = []
lineage = "required"
primary_key = ["array_asset_id", "axis_index"]

[[columns]]
name = "session_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.sessions"
description = "Session ID."

[[columns]]
name = "array_asset_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "analysis.array_assets"
description = "Array asset ID."

[[columns]]
name = "axis_index"
type = "int64"
presence = "required"
role = "structural_index"
description = "0-based axis position in stored order (Part 03 §6.2)."

[[columns]]
name = "dimension_name"
type = "string"
presence = "required"
role = "data"
vocabulary = "free"
description = "Axis name."

[[columns]]
name = "coordinate_position_column"
type = "string"
presence = "nullable"
role = "data"
vocabulary = "free"
description = "Which column of that resource holds the 0-based position."

[[columns]]
name = "coordinate_resource"
type = "string"
presence = "nullable"
role = "discriminator"
resolves = "required"
positions_in = "coordinate_position_column"
description = "The table whose rows are this axis's positions, as a dotted resource ID. The column of it holding the 0-based position is `coordinate_position_column`."

[[columns]]
name = "coordinate_array_asset_id"
type = "int32"
presence = "nullable"
role = "identifier"
identity = "assigned"
references = { resource = "analysis.array_assets", column = "array_asset_id" }
description = "A 1-D array holding one value per position (irregular axis)."

[[columns]]
name = "coordinate_unit"
type = "string"
presence = "nullable"
role = "data"
vocabulary = "open"
authority = [{ name = "UCUM", uri = "https://ucum.org/ucum" }]
description = "The physical unit of this axis's coordinate values, as a UCUM code."

[[columns]]
name = "step_value"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit_from = "coordinate_unit"
description = "Increment per position."

[[columns]]
name = "origin_value"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit_from = "coordinate_unit"
description = "Value at position 0 (regular numeric axis)."

[[columns]]
name = "step_tick_num"
type = "int64"
presence = "nullable"
role = "data"
description = "Ticks advanced per position (numerator)."

[[columns]]
name = "step_tick_den"
type = "int64"
presence = "nullable"
role = "data"
description = "Denominator of the step, in ticks. Absent means 1."

[[columns]]
name = "origin_tick"
type = "int64"
presence = "nullable"
role = "coordinate"
description = "Tick at position 0."

[[columns]]
name = "clock_id"
type = "int32"
presence = "nullable"
role = "identifier"
identity = "assigned"
references = "core.clocks"
description = "Clock the ticks are counted on (regular tick axis)."

[[rules]]
id = "analysis.array_dimensions.coordinate_pair_complete"
level = "error"
message = "an axis declares one half of its labelled coordinates; the resource says where the positions are and the column says which of its columns holds them"
sql = '''
SELECT array_asset_id, axis_index, coordinate_resource, coordinate_position_column
FROM analysis.array_dimensions
WHERE (coordinate_resource IS NULL) <> (coordinate_position_column IS NULL)'''
