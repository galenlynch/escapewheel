content_class = "core"
kind = "table"
instances = { mode = "singleton", presence = "optional" }
requires = []
lineage = "optional"
primary_key = ["array_asset_id", "channel_index"]

[[columns]]
name = "session_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.sessions"
description = "Session ID."

[[columns]]
name = "array_asset_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
description = "Array asset ID."

[[columns]]
name = "axis_index"
type = "int64"
presence = "required"
role = "structural_index"
description = "Axis that channel_index indexes, in stored order."

[[columns]]
name = "channel_index"
type = "int64"
presence = "required"
role = "structural_index"
description = "Channel dimension index."

[[columns]]
name = "channel_label"
type = "string"
presence = "nullable"
role = "data"
vocabulary = "free"
description = "Human-readable channel label."

[[columns]]
name = "inter_sample_shift"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Acquisition time offset within one sample period, in sample periods."

[[columns]]
name = "unit"
type = "string"
presence = "nullable"
role = "data"
vocabulary = "open"
authority = [{ name = "UCUM", uri = "https://ucum.org/ucum" }]
description = "The physical unit of the converted value, as a UCUM code."

[[columns]]
name = "offset"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit_from = "unit"
description = "Add after conversion."

[[columns]]
name = "conversion"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Multiply stored values by this before offset."

[[references]]
columns = ["array_asset_id", "axis_index"]
resource = "core.array_dimensions"
resource_columns = ["array_asset_id", "axis_index"]

[[rules]]
id = "core.array_channels.scaling_pair_complete"
level = "error"
message = "a conversion without a unit yields a number in no known quantity"
sql = '''
SELECT array_asset_id, channel_index
FROM core.array_channels
WHERE conversion IS NOT NULL
  AND unit IS NULL'''
