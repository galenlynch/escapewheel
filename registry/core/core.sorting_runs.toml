content_class = "core"
kind = "table"
instances = { mode = "singleton", presence = "optional" }
requires = []
lineage = "optional"
primary_key = ["sorting_run_id"]

[[columns]]
name = "session_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.sessions"
description = "Session ID."

[[columns]]
name = "sorting_run_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
description = "Stable sorting run ID."

[[columns]]
name = "sorting_run_name"
type = "string"
presence = "nullable"
role = "data"
vocabulary = "free"
description = "What `sorting_run_id` stands for: the identifier a source or an earlier packet used for this sorting run. The only bridge between two packets that numbered it differently (Part 05 §4.3)."

[[columns]]
name = "probe_id"
type = "int32"
presence = "nullable"
role = "identifier"
identity = "assigned"
references = "core.probes"
description = "Probe ID."

[[columns]]
name = "sorter_name"
type = "string"
presence = "nullable"
role = "data"
vocabulary = "free"
description = "Sorter name."

[[columns]]
name = "sorter_version"
type = "string"
presence = "nullable"
role = "data"
vocabulary = "free"
description = "Sorter version."

[[columns]]
name = "processing_run_id"
type = "int32"
presence = "nullable"
role = "identifier"
identity = "assigned"
references = "core.processing_runs"
description = "The run that produced this record, where provenance is recorded."

[[columns]]
name = "parameters"
type = "json_string"
presence = "optional"
role = "data"
description = "Sorter parameters."

[[columns]]
name = "input_array_asset_id"
type = "int32"
presence = "nullable"
role = "identifier"
identity = "assigned"
references = { resource = "core.array_assets", column = "array_asset_id" }
description = "Input array asset."

[[columns]]
name = "started_at"
type = "timestamp"
presence = "nullable"
role = "data"
description = "Start time."

[[columns]]
name = "ended_at"
type = "timestamp"
presence = "nullable"
role = "data"
description = "End time."

[[columns]]
name = "metadata"
type = "json_string"
presence = "optional"
role = "data"
description = "What the source stated about this row that the standard does not model, carried in the source's own vocabulary and read by no rule."
