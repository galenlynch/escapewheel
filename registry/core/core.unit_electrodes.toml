content_class = "core"
kind = "table"
instances = { mode = "singleton", presence = "optional" }
requires = []
lineage = "optional"
primary_key = ["session_id", "unit_id", "electrode_id"]
amendment_groups = [["session_id", "unit_id"]]

[[columns]]
name = "session_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.sessions"
description = "Session ID."

[[columns]]
name = "unit_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.units"
description = "Unit ID."

[[columns]]
name = "electrode_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.electrodes"
description = "An electrode this unit was detected on."

[[columns]]
name = "is_primary"
type = "bool"
presence = "nullable"
role = "data"
description = "Whether this is the unit's peak electrode."

[[rules]]
id = "core.unit_electrodes.one_primary"
level = "warning"
message = "a unit designates more than one peak electrode"
sql = '''
SELECT unit_id, COUNT(*) AS n
FROM core.unit_electrodes
WHERE is_primary
GROUP BY unit_id
HAVING COUNT(*) > 1'''

[[rules]]
id = "core.unit_electrodes.electrode_is_a_run_channel"
level = "error"
message = "a unit sits on an electrode its sorting run did not use"
sql = '''
SELECT ue.unit_id, ue.electrode_id
FROM core.unit_electrodes AS ue
JOIN core.units AS u ON ue.unit_id = u.unit_id
JOIN (
  SELECT DISTINCT session_id, sorting_run_id
  FROM core.sorting_run_channels
) AS d ON d.session_id = u.session_id
  AND d.sorting_run_id = u.sorting_run_id
LEFT JOIN core.sorting_run_channels AS c ON c.session_id = u.session_id
  AND c.sorting_run_id = u.sorting_run_id
  AND c.electrode_id = ue.electrode_id
WHERE c.electrode_id IS NULL'''
