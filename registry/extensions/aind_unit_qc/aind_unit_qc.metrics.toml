content_class = "extension"
kind = "table"
instances = { mode = "singleton", presence = "optional" }
requires = []
lineage = "optional"
primary_key = ["session_id", "unit_id"]
amendment_groups = [["session_id", "unit_id"]]

[[columns]]
name = "session_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.sessions"
description = "Session Id."

[[columns]]
name = "unit_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.units"
description = "Unit Id."

[[columns]]
name = "num_spikes_used"
type = "int64"
presence = "nullable"
role = "data"
description = "Spikes the metrics were computed over, where the pipeline reports it apart from core.units.n_spikes."

[[columns]]
name = "presence_ratio"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Fraction of the recording in which the unit fired."

[[columns]]
name = "firing_range"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit = "Hz"
description = "Spread of the unit's firing rate over the recording."

[[columns]]
name = "snr"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Signal-to-noise ratio of the unit's waveform."

[[columns]]
name = "isi_violations_ratio"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Refractory violations as a ratio to chance."

[[columns]]
name = "isi_violations_count"
type = "int64"
presence = "nullable"
role = "data"
description = "Refractory violations counted."

[[columns]]
name = "rp_contamination"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Contamination estimated from the refractory period."

[[columns]]
name = "rp_violations"
type = "int64"
presence = "nullable"
role = "data"
description = "Refractory-period violations counted."

[[columns]]
name = "sliding_rp_violation"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Contamination from the sliding refractory estimate. Populated for 2,555 of 4,559 units measured."

[[columns]]
name = "amplitude_cutoff"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Estimated fraction of spikes lost below threshold. Populated for 4,277 of 4,559 units measured."

[[columns]]
name = "amplitude_median"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Median spike amplitude, in the sorting's own units."

[[columns]]
name = "amplitude_cv_median"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Median of the amplitude coefficient of variation. Populated for 3,857 of 4,559 units measured."

[[columns]]
name = "amplitude_cv_range"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Range of the amplitude coefficient of variation. Populated for 3,857 of 4,559 units measured."

[[columns]]
name = "isolation_distance"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Mahalanobis distance at which as many other spikes fall inside as the unit has."

[[columns]]
name = "l_ratio"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Contamination measured in the same feature space. Populated for 4,484 of 4,559 units measured."

[[columns]]
name = "d_prime"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Linear-discriminant separation from the neighbouring cluster."

[[columns]]
name = "silhouette"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Silhouette score in the feature space."

[[columns]]
name = "nn_hit_rate"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Nearest-neighbour hit rate."

[[columns]]
name = "nn_miss_rate"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Nearest-neighbour miss rate."

[[columns]]
name = "drift_ptp"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit = "um"
description = "Peak-to-peak drift of the unit's position. Populated for 2,531 of 4,559 units measured."

[[columns]]
name = "drift_std"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit = "um"
description = "Standard deviation of that drift. Populated for 2,531 of 4,559 units measured."

[[columns]]
name = "drift_mad"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit = "um"
description = "Median absolute deviation of that drift. Populated for 2,531 of 4,559 units measured."

[[rules]]
id = "aind_unit_qc.metrics.presence_ratio_is_bounded"
level = "error"
message = "presence_ratio falls outside 0-1, which its definition does not allow"
sql = '''
SELECT session_id, unit_id, presence_ratio
FROM aind_unit_qc.metrics
WHERE presence_ratio IS NOT NULL
  AND (presence_ratio < 0 OR presence_ratio > 1)'''

[[rules]]
id = "aind_unit_qc.metrics.amplitude_cutoff_is_bounded"
level = "error"
message = "amplitude_cutoff falls outside 0-0.5, which its definition does not allow"
sql = '''
SELECT session_id, unit_id, amplitude_cutoff
FROM aind_unit_qc.metrics
WHERE amplitude_cutoff IS NOT NULL
  AND (amplitude_cutoff < 0 OR amplitude_cutoff > 0.5)'''

[[rules]]
id = "aind_unit_qc.metrics.rp_contamination_is_bounded"
level = "error"
message = "rp_contamination falls outside 0-1, which its definition does not allow"
sql = '''
SELECT session_id, unit_id, rp_contamination
FROM aind_unit_qc.metrics
WHERE rp_contamination IS NOT NULL
  AND (rp_contamination < 0 OR rp_contamination > 1)'''

[[rules]]
id = "aind_unit_qc.metrics.nn_hit_rate_is_bounded"
level = "error"
message = "nn_hit_rate falls outside 0-1, which its definition does not allow"
sql = '''
SELECT session_id, unit_id, nn_hit_rate
FROM aind_unit_qc.metrics
WHERE nn_hit_rate IS NOT NULL
  AND (nn_hit_rate < 0 OR nn_hit_rate > 1)'''

[[rules]]
id = "aind_unit_qc.metrics.nn_miss_rate_is_bounded"
level = "error"
message = "nn_miss_rate falls outside 0-1, which its definition does not allow"
sql = '''
SELECT session_id, unit_id, nn_miss_rate
FROM aind_unit_qc.metrics
WHERE nn_miss_rate IS NOT NULL
  AND (nn_miss_rate < 0 OR nn_miss_rate > 1)'''

[[rules]]
id = "aind_unit_qc.metrics.silhouette_is_bounded"
level = "error"
message = "silhouette falls outside -1-1, which its definition does not allow"
sql = '''
SELECT session_id, unit_id, silhouette
FROM aind_unit_qc.metrics
WHERE silhouette IS NOT NULL
  AND (silhouette < -1 OR silhouette > 1)'''

[[rules]]
id = "aind_unit_qc.metrics.a_count_is_not_negative"
level = "error"
message = "a violation count is negative"
sql = '''
SELECT session_id, unit_id
FROM aind_unit_qc.metrics
WHERE isi_violations_count < 0
  OR rp_violations < 0'''
