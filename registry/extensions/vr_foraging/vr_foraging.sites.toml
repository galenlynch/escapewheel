content_class = "extension"
kind = "table"
instances = { mode = "singleton", presence = "optional" }
requires = []
lineage = "optional"
primary_key = ["site_id"]

[[columns]]
name = "session_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.sessions"
description = "Session ID."

[[columns]]
name = "site_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = { resource = "core.intervals", column = "interval_id" }
description = "The site, and the interval it occupies in core. The source numbers sites from 0 within a session, and that number is the interval's `local_interval_label`, so no separate site_index is carried."

[[columns]]
name = "site_label"
type = "string"
presence = "required"
role = "data"
vocabulary = "open"
description = "What kind of site this is, in the task's own words (RewardSite, InterSite, ...)."

[[columns]]
name = "patch_label"
type = "string"
presence = "required"
role = "data"
vocabulary = "open"
description = "Patch type this site belongs to."

[[columns]]
name = "start_position"
type = "float64"
presence = "required"
role = "data"
finite = true
unit = "cm"
description = "Where the site begins along the virtual corridor."

[[columns]]
name = "length"
type = "float64"
presence = "required"
role = "data"
finite = true
unit = "cm"
description = "How far the site extends."

[[columns]]
name = "friction"
type = "float64"
presence = "required"
role = "data"
finite = true
unit = "%"
description = "Friction in force over the site, carried forward from the last friction change."

[[columns]]
name = "odor_onset_tick"
type = "int64"
presence = "nullable"
role = "coordinate"
clock_from = "core.intervals.clock_id"
description = "When odor reached the animal. Null where no odor was delivered."

[[columns]]
name = "choice_cue_tick"
type = "int64"
presence = "nullable"
role = "coordinate"
clock_from = "core.intervals.clock_id"
description = "The choice (stop) cue. Null where no choice occurred, which is what makes it the has_choice the source carries separately."

[[columns]]
name = "reward_onset_tick"
type = "int64"
presence = "nullable"
role = "coordinate"
clock_from = "core.intervals.clock_id"
description = "When water was delivered. Null where none was, which is the source's has_reward."

[[columns]]
name = "last_stop_tick"
type = "int64"
presence = "nullable"
role = "coordinate"
clock_from = "core.intervals.clock_id"
description = "The last stop before the choice cue. The source calls this last_stop_time because NWB reserves stop_time for an interval's end; here the interval's end is in core and the name is free."

[[columns]]
name = "reward_amount"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit = "mL"
description = "Water delivered."

[[columns]]
name = "reward_probability"
type = "float64"
presence = "nullable"
role = "data"
finite = true
description = "Reward probability at delivery. Null where the reward was not sampled. No unit is declared: the model says percentage for a field named probability, and which of 0-1 or 0-100 is stored has not been checked against data."

[[columns]]
name = "reward_available"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit = "mL"
description = "Water left in the patch at delivery. Null where the reward was not sampled."

[[columns]]
name = "has_forced_rewards"
type = "bool"
presence = "required"
role = "data"
description = "Whether the experimenter triggered a reward inside the site. The times are in the event stream; this says only that at least one is there."

[[columns]]
name = "has_waited_reward_delay"
type = "bool"
presence = "nullable"
role = "data"
description = "Whether the animal held through the reward delay. Null where no choice occurred."

[[columns]]
name = "velocity_at_last_stop"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit = "cm/s"
description = "Velocity at the sample closest to last_stop_tick. Null where that is null."

[[columns]]
name = "patch_index"
type = "int32"
presence = "required"
role = "sequence_position"
description = "Which patch of the session this site is in, from 0."

[[columns]]
name = "block_index"
type = "int32"
presence = "required"
role = "sequence_position"
description = "Which block of the session this site is in, from 0."

[[columns]]
name = "site_index_in_patch"
type = "int32"
presence = "required"
role = "sequence_position"
description = "Position among the sites of this patch, from 0."

[[columns]]
name = "site_index_in_block"
type = "int32"
presence = "required"
role = "sequence_position"
description = "Position among the sites of this block, from 0."

[[columns]]
name = "site_index_by_type"
type = "int32"
presence = "required"
role = "sequence_position"
description = "Position among the session's sites sharing this site_label, from 0."

[[columns]]
name = "site_index_in_patch_by_type"
type = "int32"
presence = "required"
role = "sequence_position"
description = "Position among this patch's sites sharing this site_label, from 0."

[[columns]]
name = "site_index_in_block_by_type"
type = "int32"
presence = "required"
role = "sequence_position"
description = "Position among this block's sites sharing this site_label, from 0."

[[columns]]
name = "patch_index_by_type"
type = "int32"
presence = "required"
role = "sequence_position"
description = "Position among the session's patches sharing this patch_label, from 0."

[[columns]]
name = "patch_index_in_block"
type = "int32"
presence = "required"
role = "sequence_position"
description = "Position among this block's patches, from 0."

[[columns]]
name = "patch_index_in_block_by_type"
type = "int32"
presence = "required"
role = "sequence_position"
description = "Position among this block's patches sharing this patch_label, from 0."

[[rules]]
id = "vr_foraging.sites.in_its_intervals_session"
level = "error"
message = "a site's session is not the session of the interval it occupies"
sql = '''
SELECT s.session_id, s.site_id, c.session_id AS interval_session_id
FROM vr_foraging.sites AS s
JOIN core.intervals AS c ON c.interval_id = s.site_id
WHERE c.session_id <> s.session_id'''

[[rules]]
id = "vr_foraging.sites.site_index_in_patch_counts_what_it_says"
level = "error"
message = "site_index_in_patch does not match the order it claims to record"
sql = '''
SELECT session_id, site_id, site_index_in_patch
FROM (
  SELECT session_id, site_id, site_index_in_patch,
    ROW_NUMBER() OVER (PARTITION BY session_id, patch_index ORDER BY site_id) - 1 AS expected
  FROM vr_foraging.sites
) AS derived_1
WHERE site_index_in_patch <> expected'''

[[rules]]
id = "vr_foraging.sites.site_index_in_block_counts_what_it_says"
level = "error"
message = "site_index_in_block does not match the order it claims to record"
sql = '''
SELECT session_id, site_id, site_index_in_block
FROM (
  SELECT session_id, site_id, site_index_in_block,
    ROW_NUMBER() OVER (PARTITION BY session_id, block_index ORDER BY site_id) - 1 AS expected
  FROM vr_foraging.sites
) AS derived_1
WHERE site_index_in_block <> expected'''

[[rules]]
id = "vr_foraging.sites.site_index_by_type_counts_what_it_says"
level = "error"
message = "site_index_by_type does not match the order it claims to record"
sql = '''
SELECT session_id, site_id, site_index_by_type
FROM (
  SELECT session_id, site_id, site_index_by_type,
    ROW_NUMBER() OVER (PARTITION BY session_id, site_label ORDER BY site_id) - 1 AS expected
  FROM vr_foraging.sites
) AS derived_1
WHERE site_index_by_type <> expected'''

[[rules]]
id = "vr_foraging.sites.site_index_in_patch_by_type_counts_what_it_says"
level = "error"
message = "site_index_in_patch_by_type does not match the order it claims to record"
sql = '''
SELECT session_id, site_id, site_index_in_patch_by_type
FROM (
  SELECT session_id, site_id, site_index_in_patch_by_type,
    ROW_NUMBER() OVER (PARTITION BY session_id, patch_index, site_label ORDER BY site_id) - 1 AS expected
  FROM vr_foraging.sites
) AS derived_1
WHERE site_index_in_patch_by_type <> expected'''

[[rules]]
id = "vr_foraging.sites.site_index_in_block_by_type_counts_what_it_says"
level = "error"
message = "site_index_in_block_by_type does not match the order it claims to record"
sql = '''
SELECT session_id, site_id, site_index_in_block_by_type
FROM (
  SELECT session_id, site_id, site_index_in_block_by_type,
    ROW_NUMBER() OVER (PARTITION BY session_id, block_index, site_label ORDER BY site_id) - 1 AS expected
  FROM vr_foraging.sites
) AS derived_1
WHERE site_index_in_block_by_type <> expected'''

[[rules]]
id = "vr_foraging.sites.patch_index_in_block_counts_what_it_says"
level = "error"
message = "patch_index_in_block does not match the order it claims to record"
sql = '''
SELECT session_id, site_id, patch_index_in_block
FROM (
  SELECT session_id, site_id, patch_index_in_block,
    DENSE_RANK() OVER (PARTITION BY session_id, block_index ORDER BY patch_index) - 1 AS expected
  FROM vr_foraging.sites
) AS derived_1
WHERE patch_index_in_block <> expected'''

[[rules]]
id = "vr_foraging.sites.patch_index_by_type_counts_what_it_says"
level = "error"
message = "patch_index_by_type does not match the order it claims to record"
sql = '''
SELECT session_id, site_id, patch_index_by_type
FROM (
  SELECT session_id, site_id, patch_index_by_type,
    DENSE_RANK() OVER (PARTITION BY session_id, patch_label ORDER BY patch_index) - 1 AS expected
  FROM vr_foraging.sites
) AS derived_1
WHERE patch_index_by_type <> expected'''

[[rules]]
id = "vr_foraging.sites.patch_index_in_block_by_type_counts_what_it_says"
level = "error"
message = "patch_index_in_block_by_type does not match the order it claims to record"
sql = '''
SELECT session_id, site_id, patch_index_in_block_by_type
FROM (
  SELECT session_id, site_id, patch_index_in_block_by_type,
    DENSE_RANK() OVER (PARTITION BY session_id, block_index, patch_label ORDER BY patch_index) - 1 AS expected
  FROM vr_foraging.sites
) AS derived_1
WHERE patch_index_in_block_by_type <> expected'''

[[rules]]
id = "vr_foraging.sites.reward_follows_the_choice_cue"
level = "error"
message = "water was delivered before the choice cue, so the reward delay is negative"
sql = '''
SELECT session_id, site_id, choice_cue_tick, reward_onset_tick
FROM vr_foraging.sites
WHERE choice_cue_tick IS NOT NULL
  AND reward_onset_tick IS NOT NULL
  AND reward_onset_tick < choice_cue_tick'''

[[rules]]
id = "vr_foraging.sites.the_last_stop_precedes_the_cue"
level = "error"
message = "the last stop is recorded after the choice cue it is supposed to precede"
sql = '''
SELECT session_id, site_id, last_stop_tick, choice_cue_tick
FROM vr_foraging.sites
WHERE last_stop_tick IS NOT NULL
  AND choice_cue_tick IS NOT NULL
  AND last_stop_tick > choice_cue_tick'''

[[rules]]
id = "vr_foraging.sites.a_stop_is_needed_before_a_cue"
level = "error"
message = "a choice cue is recorded with no preceding stop, which the parse requires"
sql = '''
SELECT session_id, site_id
FROM vr_foraging.sites
WHERE choice_cue_tick IS NOT NULL
  AND last_stop_tick IS NULL'''

[[rules]]
id = "vr_foraging.sites.no_choice_means_nothing_was_sampled"
level = "error"
message = "a site with no choice carries values the source only fills in when one occurred"
sql = '''
SELECT session_id, site_id
FROM vr_foraging.sites
WHERE choice_cue_tick IS NULL
  AND (
    reward_probability IS NOT NULL
    OR reward_available IS NOT NULL
    OR has_waited_reward_delay IS NOT NULL
  )'''

[[rules]]
id = "vr_foraging.sites.a_velocity_needs_a_stop"
level = "error"
message = "a velocity at the last stop is recorded where there is no last stop to take it at"
sql = '''
SELECT session_id, site_id
FROM vr_foraging.sites
WHERE velocity_at_last_stop IS NOT NULL
  AND last_stop_tick IS NULL'''

[[rules]]
id = "vr_foraging.sites.a_patch_is_contiguous"
level = "error"
message = "a patch's sites are not consecutive, so patch_index does not describe the traversal"
sql = '''
SELECT session_id, patch_index
FROM (
  SELECT session_id, patch_index,
    CAST(MAX(site_id) AS DECIMAL(38,0)) - CAST(MIN(site_id) AS DECIMAL(38,0)) + 1 AS span,
    COUNT(*) AS n
  FROM vr_foraging.sites
  GROUP BY session_id, patch_index
) AS derived_1
WHERE span <> n'''

[[rules]]
id = "vr_foraging.sites.a_block_is_contiguous"
level = "error"
message = "a block's sites are not consecutive, so block_index does not describe the traversal"
sql = '''
SELECT session_id, block_index
FROM (
  SELECT session_id, block_index,
    CAST(MAX(site_id) AS DECIMAL(38,0)) - CAST(MIN(site_id) AS DECIMAL(38,0)) + 1 AS span,
    COUNT(*) AS n
  FROM vr_foraging.sites
  GROUP BY session_id, block_index
) AS derived_1
WHERE span <> n'''

[[rules]]
id = "vr_foraging.sites.a_patch_sits_in_one_block"
level = "error"
message = "a patch spans more than one block, which patch_index_in_block cannot express"
sql = '''
SELECT session_id, patch_index
FROM (
  SELECT session_id, patch_index, COUNT(DISTINCT block_index) AS blocks
  FROM vr_foraging.sites
  GROUP BY session_id, patch_index
) AS derived_1
WHERE blocks > 1'''

[[rules]]
id = "vr_foraging.sites.a_patch_has_one_label"
level = "error"
message = "a patch carries more than one patch_label, so patch_index_by_type is undefined"
sql = '''
SELECT session_id, patch_index
FROM (
  SELECT session_id, patch_index, COUNT(DISTINCT patch_label) AS labels
  FROM vr_foraging.sites
  GROUP BY session_id, patch_index
) AS derived_1
WHERE labels > 1'''
