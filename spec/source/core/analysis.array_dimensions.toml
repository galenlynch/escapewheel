content_class = "analysis"
kind = "table"
instances = { mode = "singleton", presence = "optional" }
requires = []
lineage = "required"
primary_key = ["array_asset_id", "axis_index"]
amendment_groups = []

[[columns]]
name = "session_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.sessions"
description = "Session ID."

[[columns]]
name = "array_asset_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "analysis.array_assets"
description = "Array asset ID."

[[columns]]
name = "axis_index"
type = "int64"
presence = "required"
role = "structural_index"
description = "0-based axis position in stored order (Part 03 §6.2)."

[[columns]]
name = "dimension_name"
type = "string"
presence = "required"
role = "data"
vocabulary = "free"
description = "Axis name."

[[columns]]
name = "coordinate_resource"
type = "string"
presence = "nullable"
role = "discriminator"
resolves = "required"
discriminates_via = "analysis.array_labels.axis_index"
discriminates = "label_id"
description = "The table whose rows this axis's positions stand for, as a dotted resource ID. Each position's row is named by its label in `analysis.array_labels`."

[[columns]]
name = "depends_on_axis_index"
type = "int64"
presence = "nullable"
role = "structural_index"
description = "The axis of this array whose position, with this axis's own, decides each label. Null where this axis's position alone decides it."

[[columns]]
name = "coordinate_array_asset_id"
type = "int32"
presence = "nullable"
role = "identifier"
identity = "assigned"
references = { resource = "analysis.array_assets", column = "array_asset_id" }
description = "A 1-D array holding one value per position (irregular axis)."

[[columns]]
name = "coordinate_unit"
type = "string"
presence = "nullable"
role = "data"
vocabulary = "open"
authority = [{ name = "UCUM", uri = "https://ucum.org/ucum" }]
description = "The physical unit of this axis's coordinate values, as a UCUM code."

[[columns]]
name = "step_value"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit_from = "coordinate_unit"
description = "Increment per position."

[[columns]]
name = "origin_value"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit_from = "coordinate_unit"
description = "Value at position 0 (regular numeric axis)."

[[columns]]
name = "step_tick_num"
type = "int64"
presence = "nullable"
role = "data"
description = "Ticks advanced per position (numerator)."

[[columns]]
name = "step_tick_den"
type = "int64"
presence = "nullable"
role = "data"
description = "Denominator of the step, in ticks. Absent means 1."

[[columns]]
name = "origin_tick"
type = "int64"
presence = "nullable"
role = "coordinate"
description = "Tick at position 0."

[[columns]]
name = "clock_id"
type = "int32"
presence = "nullable"
role = "identifier"
identity = "assigned"
references = "core.clocks"
description = "Clock the ticks are counted on (regular tick axis)."

[[references]]
columns = ["array_asset_id", "depends_on_axis_index"]
resource = "analysis.array_dimensions"
resource_columns = ["array_asset_id", "axis_index"]

[[rules]]
id = "analysis.array_dimensions.axis_index_contiguous"
level = "error"
message = "axis_index is not contiguous from 0"
sql = '''
SELECT array_asset_id, COUNT(*) AS n_axes, MAX(axis_index) AS max_axis
FROM analysis.array_dimensions
GROUP BY array_asset_id
HAVING MAX(axis_index) <> COUNT(*) - 1
  OR MIN(axis_index) <> 0'''

[[rules]]
id = "analysis.array_dimensions.one_coordinate_form"
level = "error"
message = "an axis declares no coordinate form, or more than one"
sql = '''
SELECT array_asset_id, axis_index
FROM analysis.array_dimensions
WHERE (
  CASE WHEN origin_tick IS NOT NULL THEN 1 ELSE 0 END
  + CASE WHEN origin_value IS NOT NULL THEN 1 ELSE 0 END
  + CASE WHEN coordinate_array_asset_id IS NOT NULL THEN 1 ELSE 0 END
  + CASE WHEN coordinate_resource IS NOT NULL THEN 1 ELSE 0 END
) <> 1'''

[[rules]]
id = "analysis.array_dimensions.tick_axis_complete"
level = "error"
message = "a regular tick axis needs clock_id, origin_tick and step_tick_num"
sql = '''
SELECT array_asset_id, axis_index
FROM analysis.array_dimensions
WHERE origin_tick IS NOT NULL
  AND (step_tick_num IS NULL OR clock_id IS NULL)'''

[[rules]]
id = "analysis.array_dimensions.numeric_axis_complete"
level = "error"
message = "a regular numeric axis needs origin_value, step_value and coordinate_unit"
sql = '''
SELECT array_asset_id, axis_index
FROM analysis.array_dimensions
WHERE origin_value IS NOT NULL
  AND (step_value IS NULL OR coordinate_unit IS NULL)'''

[[rules]]
id = "analysis.array_dimensions.step_denominator_positive"
level = "error"
message = "a step denominator is not positive, so the step it defines is meaningless"
sql = '''
SELECT array_asset_id, axis_index, step_tick_den
FROM analysis.array_dimensions
WHERE step_tick_den IS NOT NULL
  AND step_tick_den <= 0'''

[[rules]]
id = "analysis.array_dimensions.dependent_axis_labelled"
level = "error"
message = "an axis depends on another axis and has no labels"
sql = '''
SELECT array_asset_id, axis_index, depends_on_axis_index
FROM analysis.array_dimensions
WHERE depends_on_axis_index IS NOT NULL
  AND coordinate_resource IS NULL'''

[[rules]]
id = "analysis.array_dimensions.dependency_not_chained"
level = "error"
message = "an axis depends on an axis that itself depends on another"
sql = '''
SELECT d.array_asset_id, d.axis_index, d.depends_on_axis_index
FROM analysis.array_dimensions AS d
JOIN analysis.array_dimensions AS o ON o.array_asset_id = d.array_asset_id
  AND o.axis_index = d.depends_on_axis_index
WHERE o.depends_on_axis_index IS NOT NULL'''
