content_class = "core"
kind = "table"
instances = { mode = "singleton", presence = "optional" }
requires = []
lineage = "optional"
primary_key = ["session_id", "clock_id", "start_tick"]
amendment_groups = [["session_id", "clock_id"]]

[[columns]]
name = "session_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.sessions"
description = "Session ID."

[[columns]]
name = "clock_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.clocks"
description = "The clock that was observing."

[[columns]]
name = "start_tick"
type = "int64"
presence = "required"
role = "coordinate"
description = "First tick observed, on `clock_id` itself."

[[columns]]
name = "stop_tick"
type = "int64"
presence = "required"
role = "coordinate"
description = "Last tick observed, on `clock_id` itself."

[[rules]]
use = "interval"
start = "start_tick"
stop = "stop_tick"
partition_of = ["session_id", "clock_id"]
overlap_op = "<="
overlap_message = "observation windows overlap, which would double-count observed time"
