content_class = "core"
kind = "table"
instances = { mode = "singleton", presence = "optional" }
requires = []
lineage = "optional"
primary_key = ["media_asset_id", "frame_index"]
amendment_groups = [["media_asset_id"]]

[[columns]]
name = "session_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.sessions"
description = "Session ID."

[[columns]]
name = "media_asset_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.media_assets"
description = "Media asset ID."

[[columns]]
name = "frame_index"
type = "int64"
presence = "required"
role = "structural_index"
description = "The frame's index in the order the asset presents its frames, counting from 0; not a count of exposures (Part 01 §3.18)."

[[columns]]
name = "t_tick"
type = "int64"
presence = "required"
role = "coordinate"
description = "Frame time tick."

[[columns]]
name = "clock_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.clocks"
description = "Clock ID."

[[columns]]
name = "pts"
type = "int64"
presence = "nullable"
role = "data"
description = "The frame's presentation timestamp on the container's presentation timeline, after any edit list, in the container's own time base and not rescaled; not a time on any clock the packet declares (Part 01 §3.18)."

[[columns]]
name = "dropped"
type = "bool"
presence = "nullable"
role = "data"
description = "True where the writer knows the capture produced a frame between the asset's previous frame and this one, or before the first, that the asset lacks; false where it determined none is missing; null where it could not tell. Carries no count (Part 01 §3.18)."

[[rules]]
id = "core.media_frames.frame_index_contiguous"
level = "error"
message = "frame_index is not contiguous from 0 within an asset"
sql = '''
SELECT media_asset_id, COUNT(*) AS n_frames, MAX(frame_index) AS max_index
FROM core.media_frames
GROUP BY media_asset_id
HAVING MAX(frame_index) <> COUNT(*) - 1
  OR MIN(frame_index) <> 0'''

[[rules]]
id = "core.media_frames.pts_increases_with_frame_index"
level = "error"
message = "pts is not strictly increasing in frame_index order within an asset, so the frames are not numbered in presentation order"
sql = '''
SELECT media_asset_id, frame_index, pts, prev AS previous_pts
FROM (
  SELECT media_asset_id, frame_index, pts,
    LAG(pts) OVER (PARTITION BY media_asset_id ORDER BY frame_index) AS prev
  FROM core.media_frames
  WHERE pts IS NOT NULL
) AS derived_1
WHERE prev IS NOT NULL
  AND pts <= prev'''

[[rules]]
id = "core.media_frames.t_tick_nondecreasing_with_frame_index"
level = "error"
message = "t_tick decreases in frame_index order among an asset's frames on one clock, so the frames are not timed in the order they are numbered"
sql = '''
SELECT media_asset_id, clock_id, frame_index, t_tick, prev AS previous_t_tick
FROM (
  SELECT media_asset_id, clock_id, frame_index, t_tick,
    LAG(t_tick) OVER (PARTITION BY media_asset_id, clock_id ORDER BY frame_index) AS prev
  FROM core.media_frames
) AS derived_1
WHERE prev IS NOT NULL
  AND t_tick < prev'''
