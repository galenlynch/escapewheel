content_class = "core"
kind = "table"
instances = { mode = "singleton", presence = "required" }
requires = []
lineage = "optional"
primary_key = ["session_id"]
amendment_groups = []

[[columns]]
name = "session_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
description = "Stable session ID."

[[columns]]
name = "session_name"
type = "string"
presence = "required"
role = "data"
vocabulary = "free"
description = "What `session_id` stands for: the identifier a source or an earlier packet used for this session. The only bridge between two packets that numbered it differently (Part 05 §4.3)."

[[columns]]
name = "subject_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
references = "core.subjects"
description = "Subject ID."

[[columns]]
name = "session_start_time"
type = "timestamp"
presence = "required"
role = "data"
description = "Session start time if known; if unknown use explicit null only in non-strict test packets."

[[columns]]
name = "session_end_time"
type = "timestamp"
presence = "nullable"
role = "data"
description = "When the session ended, UTC. Metadata, not derived from the tables."

[[columns]]
name = "reference_clock_id"
type = "int32"
presence = "nullable"
role = "identifier"
identity = "assigned"
references = { resource = "core.clocks", column = "clock_id" }
description = "The clock this session's times are reported on by default."

[[columns]]
name = "session_description"
type = "string"
presence = "nullable"
role = "data"
vocabulary = "free"
description = "Human-readable session description."

[[columns]]
name = "institution"
type = "string"
presence = "nullable"
role = "data"
vocabulary = "free"
description = "Institution/lab."

[[columns]]
name = "task_name"
type = "string"
presence = "nullable"
role = "data"
vocabulary = "free"
description = "Task/protocol name."

[[columns]]
name = "source_session_id"
type = "int32"
presence = "nullable"
role = "identifier"
identity = "assigned"
description = "Source-system session ID."

[[columns]]
name = "t_zero_tick"
type = "int64"
presence = "nullable"
role = "coordinate"
clock_from = "reference_clock_id"
description = "Earliest observed tick, on `reference_clock_id`; the origin seconds count from."

[[columns]]
name = "alignment_bound"
type = "float64"
presence = "nullable"
role = "data"
finite = true
unit = "{median_anchor_interval}"
description = "How far past its anchors the writer mapped, in median anchor intervals (Part 01 §3.9). Null means the default of one."

[[columns]]
name = "metadata"
type = "json_string"
presence = "optional"
role = "data"
description = "What the source stated about this row that the standard does not model, carried in the source's own vocabulary and read by no rule."

[[rules]]
id = "core.sessions.session_interval_valid"
level = "error"
message = "session_end_time precedes session_start_time"
sql = '''
SELECT session_id, session_start_time, session_end_time
FROM core.sessions
WHERE session_end_time < session_start_time'''

[[rules]]
id = "core.sessions.reference_clock_declared"
level = "error"
message = "a session declaring more than one clock names no reference clock"
sql = '''
SELECT s.session_id, COUNT(*) AS n_clocks
FROM core.sessions AS s
JOIN core.clocks AS c USING (session_id)
WHERE s.reference_clock_id IS NULL
GROUP BY s.session_id
HAVING COUNT(*) > 1'''

[[rules]]
id = "core.sessions.every_clock_reaches_the_reference"
level = "error"
message = "a clock does not reach the session's reference clock, so it cannot be converted to it"
sql = '''
WITH RECURSIVE up(clock_id, ancestor, depth) AS (
  SELECT clock_id, clock_id, 0
  FROM core.clocks
  UNION ALL
  SELECT u.clock_id, c.parent_clock_id, u.depth + 1
  FROM up AS u
  JOIN core.clocks AS c ON c.clock_id = u.ancestor
  WHERE c.parent_clock_id IS NOT NULL
    AND u.depth < 64
)
SELECT c.session_id, c.clock_id
FROM core.clocks AS c
JOIN core.sessions AS s USING (session_id)
WHERE s.reference_clock_id IS NOT NULL
  AND NOT EXISTS(
  SELECT 1
  FROM up AS u
  WHERE u.clock_id = c.clock_id
    AND u.ancestor = s.reference_clock_id
)'''

[[rules]]
id = "core.sessions.alignment_bound_at_least_default"
level = "error"
message = "a session declares an alignment bound below the default of one median anchor interval, which reaches no further than declaring nothing"
sql = '''
SELECT session_id, alignment_bound
FROM core.sessions
WHERE alignment_bound < 1.0'''
