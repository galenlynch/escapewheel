[[columns]]
name = "unit_id"
type = "int32"
presence = "required"
role = "identifier"
identity = "assigned"
description = "The thing positioned."

[[columns]]
name = "coordinate_frame"
type = "string"
presence = "required"
role = "data"
vocabulary = "open"
description = "The frame, naming a `core.coordinate_frames` row of this session; with `coordinate_basis` it completes the parent's key."

[[columns]]
name = "coordinate_basis"
type = "string"
presence = "required"
role = "data"
vocabulary = "open"
